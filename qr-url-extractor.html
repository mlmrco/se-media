<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR URL Extractor</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.2/umd/index.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header .badge {
      display: inline-block;
      background: linear-gradient(135deg, #1a56db, #6c40f7);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 100px;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a56db;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 8px;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 900px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── Drop zone ── */
    .drop-zone {
      padding: 48px 32px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }

    .drop-zone.drag-over { background: #eff6ff; }

    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }

    .drop-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #eff6ff, #ede9fe);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
    }

    .drop-icon svg { color: #1a56db; }

    .drop-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #374151;
    }

    .drop-sub {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .btn-browse {
      padding: 9px 22px;
      background: linear-gradient(135deg, #1a56db, #6c40f7);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      pointer-events: none;
    }

    /* ── Results layout ── */
    .results {
      display: none;
      grid-template-columns: 280px 1fr;
    }

    .results.visible { display: grid; }

    @media (max-width: 640px) {
      .results { grid-template-columns: 1fr; }
    }

    /* ── Image preview pane ── */
    .image-pane {
      padding: 28px 24px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #fafbff;
    }

    #preview-img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      object-fit: contain;
    }

    .scan-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .scan-badge.success { background: #d1fae5; color: #065f46; }
    .scan-badge.error   { background: #fee2e2; color: #991b1b; }

    .btn-reset {
      padding: 8px 18px;
      background: #fff;
      color: #6b7280;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }

    .btn-reset:hover { border-color: #1a56db; color: #1a56db; }

    /* ── Data pane ── */
    .data-pane {
      padding: 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    /* ── URL box ── */
    .url-box {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .url-value {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #1a56db;
      word-break: break-all;
      line-height: 1.6;
    }

    .url-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-copy {
      background: #eff6ff;
      color: #1a56db;
      border: 1.5px solid #bfdbfe;
    }

    .btn-copy:hover { background: #dbeafe; }

    .btn-open {
      background: linear-gradient(135deg, #1a56db, #6c40f7);
      color: #fff;
      border: none;
    }

    .btn-open:hover { opacity: 0.88; }
    .btn-open:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Properties grid ── */
    .props-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .prop-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .prop-card.full { grid-column: span 2; }

    .prop-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .prop-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a202c;
    }

    .prop-value.mono { font-family: 'Courier New', monospace; font-size: 0.85rem; }

    .ec-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .ec-L { background: #fef9c3; color: #854d0e; }
    .ec-M { background: #dbeafe; color: #1e40af; }
    .ec-Q { background: #ede9fe; color: #5b21b6; }
    .ec-H { background: #d1fae5; color: #065f46; }

    /* ── Capacity bar ── */
    .cap-bar-wrap {
      height: 6px;
      background: #e5e7eb;
      border-radius: 6px;
      margin-top: 6px;
      overflow: hidden;
    }

    .cap-bar {
      height: 100%;
      background: linear-gradient(90deg, #1a56db, #6c40f7);
      border-radius: 6px;
      transition: width 0.5s ease;
    }

    /* ── Chunks ── */
    .chunk-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chunk-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.82rem;
    }

    .chunk-type {
      background: #ede9fe;
      color: #5b21b6;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      margin-top: 1px;
    }

    .chunk-text {
      font-family: 'Courier New', monospace;
      color: #374151;
      word-break: break-all;
      line-height: 1.5;
    }

    /* ── Error state ── */
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 16px 18px;
      color: #991b1b;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a202c;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      transition: transform 0.3s ease;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="badge">QR Code Tools</div>
  <h1>QR URL Extractor</h1>
  <p>Upload a QR code image to decode its content and inspect its technical properties.</p>
</header>

<div class="card">

  <!-- Drop zone -->
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*" />
    <div class="drop-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="3" height="3"/><rect x="18" y="14" width="3" height="3"/>
        <rect x="14" y="18" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/>
      </svg>
    </div>
    <div class="drop-title">Drop a QR code image here</div>
    <div class="drop-sub">PNG, JPG, GIF, WebP, BMP — any standard image format</div>
    <button class="btn-browse">Browse file</button>
  </div>

  <!-- Results (hidden until scan) -->
  <div class="results" id="results">

    <!-- Left: image preview -->
    <div class="image-pane">
      <img id="preview-img" src="" alt="QR preview" />
      <div class="scan-badge" id="scan-badge">
        <span id="scan-icon">✓</span>
        <span id="scan-label">Decoded</span>
      </div>
      <button class="btn-reset" id="reset-btn">↩ Scan another</button>
    </div>

    <!-- Right: decoded data -->
    <div class="data-pane" id="data-pane">
      <!-- populated by JS -->
    </div>

  </div>

</div>

<!-- Hidden canvas for decoding -->
<canvas id="decode-canvas" style="display:none"></canvas>

<div class="toast" id="toast">✓ Copied to clipboard</div>

<script>
  // ── QR version capacity tables ────────────────────────────────────────────
  const CAP = {
    L: [0,41,77,127,187,255,322,370,461,552,652,772,883,1022,1101,1250,1408,1548,1725,1903,2061,2232,2409,2620,2812,3057,3283,3514,3669,3909,4158,4417,4686,4965,5253,5529,5836,6153,6479,6743,7089],
    M: [0,25,47,77,114,154,195,224,279,335,395,468,535,619,667,758,854,938,1046,1153,1249,1352,1460,1588,1704,1853,1990,2132,2223,2369,2520,2677,2840,3009,3183,3351,3537,3729,3927,4087,4296],
    Q: [0,17,32,53,78,106,134,154,192,230,271,321,367,425,458,520,586,644,718,792,858,929,1003,1091,1171,1273,1367,1465,1528,1628,1732,1840,1952,2068,2188,2303,2431,2563,2699,2809,2953],
    H: [0,10,20,32,48,65,82,95,118,141,167,198,226,262,282,320,361,397,442,488,528,572,618,672,721,784,842,902,940,1002,1066,1132,1201,1273,1347,1417,1496,1577,1661,1729,1817]
  };

  const EC_DESC = {
    L: 'Low — 7% recovery',
    M: 'Medium — 15% recovery',
    Q: 'Quartile — 25% recovery',
    H: 'High — 30% recovery'
  };

  const MASK_DESC = [
    '(i+j) mod 2 = 0',
    'i mod 2 = 0',
    'j mod 3 = 0',
    '(i+j) mod 3 = 0',
    '(floor(i/2)+floor(j/3)) mod 2 = 0',
    '(i×j) mod 2 + (i×j) mod 3 = 0',
    '((i×j) mod 2 + (i×j) mod 3) mod 2 = 0',
    '((i+j) mod 2 + (i×j) mod 3) mod 2 = 0'
  ];

  // ── Helpers ───────────────────────────────────────────────────────────────
  function byteLen(str) { return new TextEncoder().encode(str).length; }

  function maxCap(ec, version) {
    if (!ec || !version) return null;
    return (CAP[ec] && CAP[ec][version]) || null;
  }

  function isUrl(str) {
    return /^https?:\/\//i.test(str) || /^sms:/i.test(str) || /^tel:/i.test(str) || /^mailto:/i.test(str);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ── Image preprocessing ───────────────────────────────────────────────────
  // Grayscale + adaptive threshold to help with styled QR codes
  function preprocessImageData(src) {
    const data = new Uint8ClampedArray(src.data);
    const w = src.width, h = src.height;

    // Convert to grayscale
    const gray = new Uint8Array(w * h);
    for (let i = 0; i < data.length; i += 4) {
      gray[i >> 2] = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
    }

    // Simple global threshold at mean brightness
    let sum = 0;
    for (let g of gray) sum += g;
    const thresh = (sum / gray.length) * 0.85;

    for (let i = 0; i < gray.length; i++) {
      const v = gray[i] < thresh ? 0 : 255;
      data[i*4] = data[i*4+1] = data[i*4+2] = v;
      data[i*4+3] = 255;
    }
    return new ImageData(data, w, h);
  }

  function drawPreprocessed(ctx, canvas) {
    const raw = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const processed = preprocessImageData(raw);
    ctx.putImageData(processed, 0, 0);
  }

  function makeScaledCanvas(img, scale) {
    const c = document.createElement('canvas');
    c.width  = img.naturalWidth  * scale;
    c.height = img.naturalHeight * scale;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(img, 0, 0, c.width, c.height);
    return { canvas: c, ctx: x };
  }

  function tryJsQR(canvas, ctx) {
    const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
    return jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' });
  }

  async function tryZXing(dataUrl) {
    try {
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataUrl; });
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0);
      const id = x.getImageData(0, 0, c.width, c.height);

      // Pack RGBA into Uint8Array (ZXing wants RGB, but we pass RGBA — it reads correct channels)
      const lum = new ZXing.RGBLuminanceSource(id.data, c.width, c.height);
      const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.QRCodeReader();
      const res = reader.decode(bmp, hints);
      return res ? { data: res.getText(), source: 'ZXing' } : null;
    } catch (_) { return null; }
  }

  // ── Scan image ────────────────────────────────────────────────────────────
  function scanImage(file) {
    const reader = new FileReader();
    reader.onload = async e => {
      const src = e.target.result;
      const img = new Image();
      img.onload = async () => {
        // Show preview immediately
        document.getElementById('preview-img').src = src;
        document.getElementById('drop-zone').style.display = 'none';
        document.getElementById('results').classList.add('visible');
        document.getElementById('scan-badge').className = 'scan-badge';
        document.getElementById('scan-icon').textContent = '…';
        document.getElementById('scan-label').textContent = 'Scanning…';
        document.getElementById('data-pane').innerHTML = '';

        let result = null;

        // Strategy 1: jsQR on original
        const c1 = document.getElementById('decode-canvas');
        c1.width = img.naturalWidth; c1.height = img.naturalHeight;
        const x1 = c1.getContext('2d');
        x1.drawImage(img, 0, 0);
        result = tryJsQR(c1, x1);

        // Strategy 2: jsQR on preprocessed original
        if (!result) {
          x1.drawImage(img, 0, 0);
          drawPreprocessed(x1, c1);
          result = tryJsQR(c1, x1);
        }

        // Strategy 3: jsQR on 2× scaled + preprocessed
        if (!result) {
          const { canvas: c2, ctx: x2 } = makeScaledCanvas(img, 2);
          drawPreprocessed(x2, c2);
          result = tryJsQR(c2, x2);
        }

        // Strategy 4: jsQR on 3× scaled + preprocessed
        if (!result) {
          const { canvas: c3, ctx: x3 } = makeScaledCanvas(img, 3);
          drawPreprocessed(x3, c3);
          result = tryJsQR(c3, x3);
        }

        // Strategy 5: ZXing (handles styled / non-standard QR codes)
        if (!result) {
          result = await tryZXing(src);
        }

        if (result) {
          renderSuccess(result);
        } else {
          renderError();
        }
      };
      img.src = src;
    };
    reader.readAsDataURL(file);
  }

  // ── Render success ────────────────────────────────────────────────────────
  function renderSuccess(r) {
    const badge = document.getElementById('scan-badge');
    badge.className = 'scan-badge success';
    document.getElementById('scan-icon').textContent = '✓';
    const decoderLabel = r.source === 'ZXing' ? 'Decoded via ZXing' : 'Decoded successfully';
    document.getElementById('scan-label').textContent = decoderLabel;

    const data    = r.data || '';
    const version = r.version || null;
    const ec      = r.errorCorrectionLevel || null;   // 'L','M','Q','H' (jsQR only)
    const mask    = (r.maskPattern !== undefined) ? r.maskPattern : null;
    const chunks  = r.chunks || [];
    const zxing   = r.source === 'ZXing';
    const bytes   = byteLen(data);
    const cap     = maxCap(ec, version);
    const pct     = cap ? Math.round((bytes / cap) * 100) : null;
    const modules = version ? (version - 1) * 4 + 21 : null;
    const urlLike = isUrl(data);

    const pane = document.getElementById('data-pane');
    pane.innerHTML = '';

    // ── Decoded content ──
    const urlSection = document.createElement('div');
    urlSection.innerHTML = `
      <div class="section-label">Decoded Content</div>
      <div class="url-box">
        <div class="url-value" id="decoded-value">${escHtml(data)}</div>
        <div class="url-actions">
          <button class="btn-sm btn-copy" id="copy-btn">⎘ Copy</button>
          <button class="btn-sm btn-open" id="open-btn" ${!urlLike ? 'disabled title="Not a recognised URL scheme"' : ''}>↗ Open</button>
        </div>
      </div>`;
    pane.appendChild(urlSection);

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(data).then(() => showToast('✓ Copied to clipboard'));
    });

    if (urlLike) {
      document.getElementById('open-btn').addEventListener('click', () => {
        window.open(data, '_blank', 'noopener');
      });
    }

    // ── Technical properties ──
    const propsSection = document.createElement('div');
    propsSection.innerHTML = `<div class="section-label">Technical Properties</div>`;

    const grid = document.createElement('div');
    grid.className = 'props-grid';

    function prop(label, value, extra = '', full = false) {
      const d = document.createElement('div');
      d.className = 'prop-card' + (full ? ' full' : '');
      d.innerHTML = `<div class="prop-label">${label}</div><div class="prop-value">${value}</div>${extra}`;
      return d;
    }

    grid.appendChild(prop('QR Version', version ? `Version ${version}` : '—'));
    grid.appendChild(prop('Module Grid', modules ? `${modules} × ${modules}` : '—'));
    grid.appendChild(prop('Error Correction',
      ec ? `<span class="ec-pill ec-${ec}">${ec}</span>` : '—',
      ec ? `<div style="font-size:0.75rem;color:#6b7280;margin-top:4px">${EC_DESC[ec]}</div>` : ''
    ));
    grid.appendChild(prop('Mask Pattern',
      mask !== null ? `Pattern ${mask}` : '—',
      mask !== null ? `<div style="font-size:0.72rem;color:#6b7280;margin-top:4px;font-family:monospace">${MASK_DESC[mask]}</div>` : ''
    ));
    grid.appendChild(prop('Data Length', `${bytes} byte${bytes !== 1 ? 's' : ''}`, '', false));
    grid.appendChild(prop('Max Capacity', cap ? `${cap} bytes (EC ${ec})` : '—', '', false));

    if (cap !== null) {
      grid.appendChild(prop('Capacity Used',
        `${bytes} / ${cap} bytes (${pct}%)`,
        `<div class="cap-bar-wrap"><div class="cap-bar" style="width:${Math.min(pct,100)}%"></div></div>`,
        true
      ));
    }

    propsSection.appendChild(grid);
    pane.appendChild(propsSection);

    // ── Encoding chunks ──
    if (chunks && chunks.length > 0) {
      const chunkSection = document.createElement('div');
      chunkSection.innerHTML = `<div class="section-label">Encoding Segments</div>`;
      const list = document.createElement('div');
      list.className = 'chunk-list';
      chunks.forEach(ch => {
        const item = document.createElement('div');
        item.className = 'chunk-item';
        item.innerHTML = `<span class="chunk-type">${escHtml(ch.type || 'byte')}</span><span class="chunk-text">${escHtml(ch.text || '')}</span>`;
        list.appendChild(item);
      });
      chunkSection.appendChild(list);
      pane.appendChild(chunkSection);
    }

    // ── ZXing note (when jsQR properties unavailable) ──
    if (zxing) {
      const note = document.createElement('div');
      note.style.cssText = 'font-size:0.78rem;color:#6b7280;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;';
      note.innerHTML = '⚠️ Decoded via ZXing fallback (styled/non-standard QR). Version, error correction, and mask details are not available from this decoder.';
      pane.appendChild(note);
    }

    // ── Location corners ──
    if (r.location) {
      const loc = r.location;
      const tl = loc.topLeftCorner, tr = loc.topRightCorner, bl = loc.bottomLeftCorner;
      const w  = Math.round(Math.abs(tr.x - tl.x));
      const h  = Math.round(Math.abs(bl.y - tl.y));
      const locSection = document.createElement('div');
      locSection.innerHTML = `<div class="section-label">Detected Position</div>`;
      const lg = document.createElement('div');
      lg.className = 'props-grid';
      lg.appendChild(prop('Top-Left', `(${Math.round(tl.x)}, ${Math.round(tl.y)}) px`));
      lg.appendChild(prop('Top-Right', `(${Math.round(tr.x)}, ${Math.round(tr.y)}) px`));
      lg.appendChild(prop('Bottom-Left', `(${Math.round(bl.x)}, ${Math.round(bl.y)}) px`));
      lg.appendChild(prop('Code Size', `${w} × ${h} px`));
      locSection.appendChild(lg);
      pane.appendChild(locSection);
    }
  }

  // ── Render error ──────────────────────────────────────────────────────────
  function renderError() {
    const badge = document.getElementById('scan-badge');
    badge.className = 'scan-badge error';
    document.getElementById('scan-icon').textContent = '✕';
    document.getElementById('scan-label').textContent = 'No QR code detected';

    const pane = document.getElementById('data-pane');
    pane.innerHTML = `
      <div class="error-box">
        <strong>Could not decode a QR code from this image.</strong><br><br>
        Tips:
        <ul style="margin-top:8px;padding-left:18px;line-height:2">
          <li>Ensure the image contains a single, clearly visible QR code.</li>
          <li>Crop tightly — large white borders or surrounding clutter can help.</li>
          <li>Use a higher-resolution source image.</li>
          <li>Styled or heavily branded QR codes may fail if contrast is too low.</li>
        </ul>
      </div>`;
  }

  // ── Utility ───────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // ── Reset ─────────────────────────────────────────────────────────────────
  document.getElementById('reset-btn').addEventListener('click', () => {
    document.getElementById('results').classList.remove('visible');
    document.getElementById('drop-zone').style.display = '';
    document.getElementById('file-input').value = '';
  });

  // ── File input ────────────────────────────────────────────────────────────
  document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) scanImage(file);
  });

  // ── Drag & drop ───────────────────────────────────────────────────────────
  const dz = document.getElementById('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', ()  => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) scanImage(file);
  });
</script>
</body>
</html>
